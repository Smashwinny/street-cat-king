<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🐱 街区猫王 Street Cat King · 立体版</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <section id="setup-screen"></section>
  <section id="game-screen" class="hidden">
    <header id="topbar"></header>
    <div id="main">
      <div id="map-wrap"><div id="map"></div></div>
      <aside id="side">
        <div id="players-bar"></div>
        <div id="action-panel"></div>
        <div id="log-wrap">
          <button id="log-toggle" type="button">📜 战报 <span class="chev">▾</span></button>
          <div id="log"></div>
        </div>
      </aside>
    </div>
  </section>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="grain"></div>
<!-- 特效层：萤火虫 / 飘字 / 尘土 / 爪痕 / 光环（pointer-events:none，不拦截点击） -->
<div id="fx-layer"></div>
<!-- 回合电影黑条横幅 -->
<div id="banner" class="hidden"><div class="cine-bar top"></div><div class="cine-bar bottom"></div><div id="banner-text"></div></div>
<!-- 昼夜转场 -->
<div id="daynight" class="hidden"><div class="sweep"></div><div id="daynight-icon"></div></div>
<!-- 开屏 -->
<div id="splash">
  <div class="splash-rays"></div>
  <div class="splash-inner">
    <div class="splash-cats"><img src="assets/cats/black-idle.webp" alt="黑猫"><img class="splash-mid" src="assets/cats/orange-idle.webp" alt="橘猫"><img src="assets/cats/cow-idle.webp" alt="奶牛猫"></div>
    <h1 class="logo">街区猫王</h1>
    <p class="splash-en">STREET CAT KING</p>
    <p class="splash-sub">流浪猫策略领地争夺 · 电影之夜开幕</p>
    <button id="enter-btn" class="primary">🐾 点击进入街区</button>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    CKG_UI.init();
    if (window.__SMOKE__) { try { CKG_UI.smokeRun(); } catch (e) { document.title = 'SMOKE_FAIL ' + e.message; } }
  });
</script>
</body>
</html>
