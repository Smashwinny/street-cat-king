<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🐱 街区猫王 Street Cat King · 电影版</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <section id="setup-screen"></section>
  <section id="game-screen" class="hidden">
    <header id="topbar"></header>
    <div id="main">
      <div id="map-wrap"><div id="map"></div></div>
      <aside id="side">
        <div id="players-bar"></div>
        <div id="action-panel"></div>
        <div id="log-wrap">
          <button id="log-toggle" type="button">📜 战报 <span class="chev">▾</span></button>
          <div id="log"></div>
        </div>
      </aside>
    </div>
  </section>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="grain"></div>
<script src="js/config.js"></script>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    CKG_UI.init();
    if (window.__SMOKE__) { try { CKG_UI.smokeRun(); } catch (e) { document.title = 'SMOKE_FAIL ' + e.message; } }
  });
</script>
</body>
</html>
